name: Testes Python

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Executar testes e gravar log de deploy
        run: |
          mkdir -p log
          python scripts/gravar_log_deploy.py
      - name: Publicar artefato de log
        uses: actions/upload-artifact@v4
        with:
          name: log-deploy
          path: log/*.log
