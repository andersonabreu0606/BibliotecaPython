name: Testes Python

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Executar testes e gravar log de deploy
        run: |
          mkdir -p log
          python scripts/gravar_log_deploy.py
      - name: Publicar artefato de log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-deploy-${{ github.run_id }}
          path: log/*.log
          if-no-files-found: warn
          retention-days: 30
